{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item"><a href="#" class="theme-toggle" role="button" aria-label="Toggle night mode" onclick="var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); try { localStorage.setItem('theme', next); } catch (e) {} return false;"><i class="fas fa-moon icon-moon" aria-hidden="true"></i><i class="fas fa-sun icon-sun" aria-hidden="true"></i></a></li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
  /* Align the first menu link ("About") with the left edge of the main text.
     Only applies when the sidebar sits beside the content (>= 1024px wide). */
  (function () {
    function align() {
      var title = document.querySelector('#site-nav .visible-links li:first-child');
      var about = document.querySelector('#site-nav .visible-links li:nth-child(2) a');
      var main = document.querySelector('#main .page__content, #main .archive');
      if (!title || !about || !main) return;
      title.style.paddingRight = '';                     // reset to theme default
      if (window.innerWidth < 1024) return;
      var first = main.firstElementChild || main;
      var shift = first.getBoundingClientRect().left - about.getBoundingClientRect().left;
      var current = parseFloat(getComputedStyle(title).paddingRight) || 0;
      var next = current + shift;
      if (next > 0) title.style.paddingRight = next + 'px';
    }
    document.addEventListener('DOMContentLoaded', align);
    window.addEventListener('load', align);
    window.addEventListener('resize', align);
  })();
</script>
