{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item"><a href="#" class="theme-toggle" role="button" aria-label="Toggle night mode" onclick="var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); try { localStorage.setItem('theme', next); } catch (e) {} return false;"><i class="fas fa-moon icon-moon" aria-hidden="true"></i><i class="fas fa-sun icon-sun" aria-hidden="true"></i></a></li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
  /* Push the menu (About ... night-mode icon) to the right so its right edge
     lines up with the right edge of the page content (e.g. the headshot). */
  (function () {
    function align() {
      var title = document.querySelector('#site-nav .visible-links li:first-child');
      var last = document.querySelector('#site-nav .visible-links li:last-child');
      var main = document.querySelector('#main .page__content, #main .archive');
      var btn = document.querySelector('#site-nav > button');
      if (!title || !last || !main || title === last) return;
      title.style.paddingRight = '';                     // reset to theme default
      if (btn && !btn.classList.contains('hidden')) return; // menu collapsed: leave alone
      var shift = main.getBoundingClientRect().right - last.getBoundingClientRect().right - 1;
      var current = parseFloat(getComputedStyle(title).paddingRight) || 0;
      if (shift > 0) title.style.paddingRight = (current + shift) + 'px';
    }
    document.addEventListener('DOMContentLoaded', align);
    window.addEventListener('load', align);
    window.addEventListener('resize', align);
  })();
</script>
